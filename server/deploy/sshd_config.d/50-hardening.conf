# /etc/ssh/sshd_config.d/50-hardening.conf
# sshd keeps the first value it reads and 50-cloud-init.conf sorts first: check the result with `sshd -T`.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 20
# smz3pull: the backup pull user (backup/PULL.md), locked down by its authorized_keys line.
AllowUsers ubuntu smz3pull
ClientAliveInterval 300
ClientAliveCountMax 2
AllowAgentForwarding no
AllowTcpForwarding local
