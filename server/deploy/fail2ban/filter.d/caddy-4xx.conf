# /etc/fail2ban/filter.d/caddy-4xx.conf: Caddy's JSON access log, 4xx answers on the duckdns host.
# In each line remote_ip comes before host, and status near the end; header values are JSON-escaped.
[Definition]
failregex = ^\{.*"remote_ip":"<HOST>".*"host":"smz3-universe\.duckdns\.org(?::\d+)?".*"status":4\d\d\b
ignoreregex =
datepattern = "ts":{EPOCH}
