# /etc/systemd/system/smz3.service.d/hardening.conf
# Children (smz3daily, smz3check, smz3draft, smz3-maprando) inherit all of this; their outputs go under data/ too.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/srv/smz3/app/data
PrivateTmp=yes
ProtectHome=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
# Outbound HTTPS to api.github.com (release check), Redis on 127.0.0.1:6379, DNS through the local resolver.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0027
# A Map Rando job takes 400-800 MB and runs one at a time; MemoryDenyWriteExecute stays off for node's JIT.
MemoryMax=4G
TasksMax=256
